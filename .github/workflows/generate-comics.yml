name: Generate Python Comics
on:
  push:
    paths:
      - "tools/generate_comics.py"
      - "tools/generate_content.py"
      - ".github/workflows/generate-comics.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  comics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/generate_comics.py
      - run: python tools/generate_content.py
      - name: Commit generated comics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/comics js/generated-content.js js/generated-paperwork.js
          git diff --cached --quiet || git commit -m "Generate Python comic artwork"
          git push
